<!DOCTYPE html>
<html>
<head>
    <title>Systems Dashboard</title>
</head>

<body>

<h2>Systems Dashboard</h2>

<p id="status">Loading...</p>

<input id="q" placeholder="hostname / serial">
<button onclick="search()">Search</button>

<p id="count"></p>

<table border="1">
    <thead>
        <tr>
            <th>Platform</th>
            <th>Model</th>
            <th>Host</th>
            <th>Serial</th>
            <th>Expiry</th>
        </tr>
    </thead>

    <tbody id="tb"></tbody>
</table>

<script>

let DATA = [];

async function load() {

    const res = await fetch("/api/systems");
    const json = await res.json();

    DATA = json.data;

    document.getElementById("status").innerText =
        "Ready: " + json.count;
}

function render(data) {

    document.getElementById("count").innerText =
        "Results: " + data.length;

    document.getElementById("tb").innerHTML =
        data.map(s => `
        <tr>
            <td>${s.platformType || ""}</td>
            <td>${s.hardwareModel?.name || ""}</td>
            <td>${s.hostName || ""}</td>
            <td>${s.serialNumber || ""}</td>
            <td>${s.contract?.expiryDate || ""}</td>
        </tr>
        `).join("");
}

function search() {

    const k = document.getElementById("q").value.toLowerCase();

    render(DATA.filter(s =>
        (s.hostName || "").toLowerCase().includes(k) ||
        (s.serialNumber || "").toLowerCase().includes(k)
    ));
}

load();

</script>

</body>
</html>
